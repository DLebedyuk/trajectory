<title>Траектория</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F0F4; --surface:#FBFAFC; --surface-2:#E9E7EE; --surface-3:#E1DEE8;
  --line:#DEDBE5; --line-strong:#C8C3D4;
  --text:#211F2A; --text-2:#575269; --text-3:#8B8599;
  --ink:#221F2C; --ink-contrast:#FBFAFC;
  --cell-empty:#E2E0E9;
  --shadow:0 1px 2px rgba(33,31,42,.05), 0 8px 24px -12px rgba(33,31,42,.14);
  --shadow-lift:0 2px 4px rgba(33,31,42,.06), 0 18px 40px -16px rgba(33,31,42,.24);
  --good:#3F7A5C; --tg:#3E7FA8; --cal:#6F6A82;
  --d-act:#C05A6E; --d-voice:#BE8A3C; --d-vocal:#8B6BC8; --d-eng:#3E8F86; --d-phys:#4C74B0;
  --radius:14px; --radius-sm:9px; --rail:236px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131218; --surface:#1B1A23; --surface-2:#232130; --surface-3:#2A2836;
    --line:#2C2A38; --line-strong:#413E51;
    --text:#EFEDF4; --text-2:#ABA5BA; --text-3:#736D83;
    --ink:#EFEDF4; --ink-contrast:#17161E; --cell-empty:#232130;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 48px -18px rgba(0,0,0,.8);
    --good:#6FA98A; --tg:#6BA8CE; --cal:#9A93AD;
    --d-act:#D07386; --d-voice:#D3A055; --d-vocal:#A183DC; --d-eng:#4FA79D; --d-phys:#6690C9;
  }
}
:root[data-theme="dark"]{
  --bg:#131218; --surface:#1B1A23; --surface-2:#232130; --surface-3:#2A2836;
  --line:#2C2A38; --line-strong:#413E51;
  --text:#EFEDF4; --text-2:#ABA5BA; --text-3:#736D83;
  --ink:#EFEDF4; --ink-contrast:#17161E; --cell-empty:#232130;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 48px -18px rgba(0,0,0,.8);
  --good:#6FA98A; --tg:#6BA8CE; --cal:#9A93AD;
  --d-act:#D07386; --d-voice:#D3A055; --d-vocal:#A183DC; --d-eng:#4FA79D; --d-phys:#6690C9;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text);
 font-family:"Golos Text","Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; font-family:"Literata",Georgia,serif; font-weight:500; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-align:left}
input,textarea,select{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--d-phys); outline-offset:2px; border-radius:5px}
.lbl{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.1em;
 text-transform:uppercase; color:var(--text-3); font-weight:500}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.tmeta svg,.hint svg,.row-sub svg,.tgroup .lbl svg{width:12px; height:12px; flex:none; vertical-align:-1px}
.chip svg{width:14px; height:14px; flex:none}
.row > svg{width:14px; height:14px; flex:none; margin-top:3px; color:var(--text-3)}
.setrow-main svg{width:13px; height:13px; flex:none}
.tgroup .lbl{display:flex; align-items:center; gap:6px}

/* --- закреплённые задачи --- */
.pin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:11px}
.pincard{border:1px solid var(--line); border-left:3px solid var(--pc,var(--line-strong)); border-radius:11px;
 padding:11px 13px; background:var(--surface); display:flex; gap:10px; align-items:flex-start;
 transition:box-shadow .15s, transform .15s, border-color .15s}
.pincard:hover{box-shadow:var(--shadow); transform:translateY(-1px)}
.pc-proj{font-size:11.5px; color:var(--text-3); line-height:1.25}
.pc-task{font-size:13.5px; font-weight:500; margin-top:2px; line-height:1.3}
.pc-meta{font-size:11px; color:var(--text-3); margin-top:6px; display:flex; gap:5px; align-items:center; flex-wrap:wrap}
.pc-meta svg{width:11px; height:11px}
.unpin{opacity:0; color:var(--text-3); flex:none; transition:opacity .12s; padding:2px}
.pincard:hover .unpin{opacity:.8}
.unpin:hover{opacity:1 !important}
.unpin svg{width:12px; height:12px}

/* --- фокус --- */
.focusbar{border:1.5px solid var(--fc,var(--line-strong)); border-radius:16px; padding:18px 20px; background:var(--surface);
 position:relative; overflow:hidden}
.focusbar::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--fc,var(--line-strong))}
.fb-dir{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2)}
.fb-proj{font-size:14.5px; color:var(--text); margin-top:14px; font-weight:500}
.fb-proj button{text-decoration:none; border-bottom:1px solid var(--line-strong); padding-bottom:1px}
.fb-proj button:hover{border-color:var(--text-3)}
.fb-task{font-family:"Literata",serif; font-size:21px; line-height:1.25; margin-top:3px}
.fb-acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:16px}

/* --- плашка направления --- */
.dirrow{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:24px; align-items:start;
 border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:18px 20px; margin-bottom:12px;
 transition:border-color .15s, box-shadow .15s}
.dirrow:hover{border-color:var(--line-strong); box-shadow:var(--shadow)}
.dirrow-l{display:flex; flex-direction:column; gap:13px; text-align:left; width:100%}
.dirrow-r{display:flex; flex-direction:column; gap:8px}
.dirpin{display:block; width:100%; text-align:left; padding:8px 11px; border-radius:9px; border:1px solid var(--line)}
.dirpin:hover{background:var(--surface-2)}

/* --- задачи проекта --- */
.tline{display:flex; align-items:flex-start; gap:11px; padding:11px 12px; border-radius:10px; border:1px solid transparent}
.tline:hover{background:var(--surface-2)}
.tline.act{border-color:var(--tc,var(--line-strong)); background:color-mix(in srgb, var(--tc) 7%, transparent)}
.tline-main{flex:1; min-width:0}
.tline-title{font-size:14px; font-weight:500}
.tline-meta{font-size:11.5px; color:var(--text-3); display:flex; gap:13px; align-items:center; margin-top:3px; flex-wrap:wrap}
.tline-meta i{display:inline-flex; gap:4px; align-items:center; font-style:normal}
.tline-meta svg{width:11px; height:11px}
.pinbtn{opacity:.3; flex:none; color:var(--text-3); padding:2px; transition:opacity .12s, color .12s}
.tline:hover .pinbtn{opacity:.75}
.pinbtn.on{opacity:1 !important; color:var(--text-2)}
.pinbtn svg{width:15px; height:15px}

.filterbar{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px; padding-bottom:12px; border-bottom:1px solid var(--line)}
.filterbar select{width:auto; padding:5px 26px 5px 9px; font-size:12.5px; border-radius:7px}
.filterbar label{display:inline-flex; gap:7px; align-items:center; font-size:12.5px; color:var(--text-2); cursor:pointer}
.filterbar input[type=checkbox]{width:auto}

/* --- полоса книг --- */
.strip{display:flex; gap:10px; flex-wrap:wrap}
.chipcard{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:11px;
 padding:8px 13px 8px 10px; background:var(--surface); transition:border-color .14s}
.chipcard:hover{border-color:var(--line-strong)}
.chipcard .em{font-size:19px; line-height:1}
@keyframes flyin{from{opacity:0; transform:translateY(12px) scale(.93)} to{opacity:1; transform:none}}
.flyin{animation:flyin .3s cubic-bezier(.2,.9,.3,1.05)}
@keyframes settle{from{opacity:.35; transform:scale(.96)} to{opacity:1; transform:none}}
.settle{animation:settle .24s ease}
.mitem .mtitle{font-size:13.5px}
.cover span.em{font-size:30px}
.cover .init{font-size:74px}
.pinfab{position:absolute; right:7px; bottom:7px; z-index:3; width:26px; height:26px; border-radius:8px;
 display:grid; place-items:center; background:var(--surface); border:1px solid var(--line-strong); color:var(--text-3); opacity:.9}
.pinfab.on{background:var(--ink); color:var(--ink-contrast); border-color:var(--ink)}
.pinfab svg{width:13px; height:13px}
.quiet{font-size:12px; color:var(--text-3)}
.quiet-link{font-size:12.5px; color:var(--text-2); text-decoration:underline; text-underline-offset:2px}
.quiet-link:hover{color:var(--text)}
@media (max-width:820px){ .dirrow{grid-template-columns:minmax(0,1fr); gap:16px} }
.hint{font-size:12px; color:var(--text-3)}

/* shell */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail,.app>main{min-width:0}
.rail{border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column;
 padding:22px 14px 16px; position:sticky; top:0; height:100vh; gap:20px}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.brand-mark{width:26px; height:26px; flex:none}
.brand-name{font-family:"Literata",serif; font-size:17px; letter-spacing:-.02em}
.brand-sub{font-size:10.5px; color:var(--text-3); margin-top:-2px}
.nav{display:flex; flex-direction:column; gap:1px}
.nav button{display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:var(--radius-sm);
 color:var(--text-2); font-size:13.5px; font-weight:500; width:100%; transition:background .12s, color .12s}
.nav button:hover{background:var(--surface-2); color:var(--text)}
.nav button.on{background:var(--surface-2); color:var(--text); font-weight:600}
.nav svg{width:16px; height:16px; flex:none; opacity:.75}
.nav button.on svg{opacity:1}
.nav .cnt{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px;
 background:var(--surface-3); color:var(--text-2); border-radius:20px; padding:1px 7px; font-weight:600}
.rail-foot{margin-top:auto; display:flex; flex-direction:column; gap:9px; padding:0 4px}
.seg{display:flex; background:var(--surface-2); border-radius:8px; padding:2px; gap:2px}
.seg button{flex:1; padding:5px 6px; border-radius:6px; font-size:11.5px; color:var(--text-3); font-weight:500; text-align:center}
.seg button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08)}

main{padding:26px 34px 80px; max-width:1200px; min-width:0}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px}
.page-title{font-size:26px}
.page-sub{color:var(--text-2); margin-top:5px; font-size:14px; max-width:70ch}
.back{display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 7px; border-radius:8px;
 color:var(--text-2); font-size:12.5px; margin-bottom:14px; border:1px solid transparent}
.back:hover{background:var(--surface-2); color:var(--text)}
.back svg{width:14px; height:14px}

/* buttons */
.btn{display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:9px; background:var(--surface);
 border:1px solid var(--line-strong); font-size:13px; font-weight:500; transition:border-color .12s, background .12s, transform .08s}
.btn:hover{border-color:var(--text-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:14px; height:14px; flex:none}
.btn-primary{background:var(--ink); color:var(--ink-contrast); border-color:var(--ink)}
.btn-primary:hover{opacity:.88; border-color:var(--ink)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--text)}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:7px}
.btn-ai{border-style:dashed; color:var(--text-2)}
.btn-ai:hover{color:var(--text)}
.btn-danger:hover{border-color:var(--d-act); color:var(--d-act)}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.card-h svg{width:16px; height:16px; flex:none}
.stack{display:flex; flex-direction:column; gap:16px}
.two{display:grid; grid-template-columns:minmax(0,1fr) 316px; gap:22px; align-items:start}
.side{display:flex; flex-direction:column; gap:14px; position:sticky; top:26px}
.sec-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; gap:10px}

/* today */
.today{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.today-h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px 12px}
.trow{display:flex; align-items:center; gap:12px; padding:9px 18px; border-top:1px solid var(--line)}
.trow:hover{background:var(--surface-2)}
.ttime{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--text-2); width:78px; flex:none; font-weight:500}
.ttime.soft{color:var(--text-3); font-size:10.5px; width:78px; letter-spacing:-.02em; white-space:nowrap}
.tico{width:22px; height:22px; border-radius:7px; display:grid; place-items:center; flex:none}
.tico svg{width:13px; height:13px}
.tmain{flex:1; min-width:0}
.tmain b{font-weight:500; font-size:13.5px; display:block}
.tmeta{font-size:11.5px; color:var(--text-3); display:flex; gap:7px; align-items:center; margin-top:1px; flex-wrap:wrap}
.tgroup{padding:11px 18px 13px; border-top:1px solid var(--line); background:var(--surface-2)}
.tgroup .lbl{margin-bottom:8px; display:block}
.tg-item{display:flex; align-items:center; gap:10px; padding:5px 0}
.done-strike{text-decoration:line-through; color:var(--text-3)}

/* checkbox */
.check{width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line-strong); flex:none;
 display:grid; place-items:center; transition:border-color .12s, background .12s}
.check svg{width:10px; height:10px; opacity:0; color:var(--good)}
.check:hover{border-color:var(--good)}
.check:hover svg{opacity:.85}
.check.on{background:var(--good); border-color:var(--good)}
.check.on svg{opacity:1; color:#fff}

/* focus */
.focus{border:1.5px solid var(--fc,var(--line-strong)); border-radius:16px; padding:20px 22px; background:var(--surface);
 position:relative; overflow:hidden}
.focus::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--fc,var(--line-strong))}
.focus-lvl{display:flex; align-items:baseline; gap:9px; margin-bottom:3px}
.focus-dir{font-size:12.5px; color:var(--text-2); display:flex; align-items:center; gap:6px}
.focus-proj{font-family:"Literata",serif; font-size:21px; margin:6px 0 2px}
.focus-step{display:flex; align-items:flex-start; gap:11px; margin-top:14px; padding:13px 15px;
 background:var(--surface-2); border-radius:11px}
.focus-step .lbl{display:block; margin-bottom:3px}
.focus-acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:15px}
.focus-empty{border:1px dashed var(--line-strong); border-radius:16px; padding:24px; background:transparent; text-align:center}

/* heatmap */
.heat{display:flex; gap:var(--hgap,3px); align-items:flex-start}
.heat-col{display:flex; flex-direction:column; gap:var(--hgap,3px)}
.heat-cell{width:var(--hcell,12px); height:var(--hcell,12px); border-radius:3px; background:var(--cell-empty); transition:transform .1s}
.heat-cell[data-n]{cursor:pointer}
.heat-cell[data-n]:hover{transform:scale(1.35)}
.heat-cell.future{background:transparent}
.heat-wrap{overflow-x:auto; padding-bottom:4px}
.heat-months{display:flex; gap:var(--hgap,3px); margin-bottom:5px; height:13px}
.heat-months span{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--text-3); white-space:nowrap}
.heat-side{display:flex; flex-direction:column; gap:var(--hgap,3px); margin-right:7px; padding-top:18px}
.heat-side span{height:var(--hcell,12px); font-family:"JetBrains Mono",monospace; font-size:9.5px; color:var(--text-3); line-height:var(--hcell,12px)}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:13px}
.legend b{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--text-2)}
.dot{width:9px; height:9px; border-radius:3px; flex:none; display:inline-block}
.glyph{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none}
.glyph svg{width:15px; height:15px}
.glyph-lg{width:44px; height:44px; border-radius:13px}
.glyph-lg svg{width:22px; height:22px}

/* rows & tags */
.row{display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1; min-width:0}
.row-title{font-size:13.5px; font-weight:500}
.row-sub{font-size:11.5px; color:var(--text-3); margin-top:2px; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.chipdir{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-2)}
.tag{display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:6px; background:var(--surface-2);
 font-size:11px; color:var(--text-2); font-weight:500; white-space:nowrap}
.tag svg{width:11px; height:11px; flex:none}
.tag.q{background:transparent; border:1px solid var(--line-strong)}
.tag.due{border:1px solid var(--d-voice); color:var(--d-voice); background:transparent}
.tag.must{background:color-mix(in srgb, var(--d-phys) 14%, transparent); color:var(--d-phys)}
.tag.back{background:var(--surface-2); color:var(--text-3)}

/* collapsible */
.fold{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
.fold-h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 17px; width:100%}
.fold-h:hover{background:var(--surface-2); border-radius:var(--radius)}
.fold-b{padding:0 17px 14px}
.fold-h .lbl{display:inline-flex; align-items:center; gap:7px}
.fold-h .lbl svg{width:13px; height:13px; flex:none}

/* filters */
.filters{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin-bottom:18px}
.fset{display:flex; flex-direction:column; gap:5px}
.fset .lbl{padding-left:2px}
.fgroup{display:flex; gap:3px; background:var(--surface-2); padding:3px; border-radius:9px; flex-wrap:wrap}
.fgroup button{padding:4px 9px; border-radius:6px; font-size:12px; color:var(--text-3); font-weight:500; white-space:nowrap; text-align:center}
.fgroup button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* grids */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px}
.tile{border:1px solid var(--line); border-radius:var(--radius); padding:15px; background:var(--surface); display:block; width:100%;
 transition:box-shadow .15s, transform .15s, border-color .15s}
.tile:hover{box-shadow:var(--shadow); transform:translateY(-1px); border-color:var(--line-strong)}
.mcard{border:1px solid var(--line); border-radius:var(--radius); padding:15px; background:var(--surface);
 display:flex; flex-direction:column; gap:9px; min-height:138px; transition:box-shadow .16s, transform .16s}
.mcard:hover{box-shadow:var(--shadow-lift); transform:translateY(-2px)}
.mcard .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:auto}
.mcard-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:9px; padding-top:10px; border-top:1px solid var(--line)}

/* media */
.mediagrid{display:grid; grid-template-columns:repeat(auto-fill,148px); gap:14px; justify-content:start}
.mitem{display:flex; flex-direction:column; gap:9px}
.cover{width:100%; aspect-ratio:2/3; border-radius:11px; display:grid; place-items:center; position:relative; overflow:hidden;
 border:1px solid var(--line); cursor:pointer; transition:transform .16s, box-shadow .16s}
.cover:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.cover span.em{font-size:42px; position:relative; z-index:2}
.cover .init{position:absolute; inset:0; display:grid; place-items:center; font-family:"Literata",serif;
 font-size:110px; color:var(--text); opacity:.07; z-index:1; user-select:none}
.cover::after{content:""; position:absolute; inset:0; background:radial-gradient(120% 80% at 22% 12%, rgba(255,255,255,.35), transparent 60%); pointer-events:none}
.cover .badge{position:absolute; left:8px; top:8px; background:var(--ink); color:var(--ink-contrast);
 font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600}

/* безопасная миграция старых сохранений */
function migrate(d){
  if(!d||typeof d!=="object") return null;
  if(d.v===3) return d;
  try{
    d.v=3;
    (d.dirs||[]).forEach(x=>{ delete x.mainProject; if(x.showMotto===undefined)x.showMotto=!!x.motto; });
    (d.projects||[]).forEach(p=>{ if(p.status==="someday")p.status="paused"; if(!p.notes)p.notes=[]; });
    (d.tasks||[]).forEach(t=>{ delete t.kind; if(t.pinned===undefined)t.pinned=false;
      if(!t.checklist)t.checklist=[]; if(t.status!=="done")t.status="open"; });
    if(d.focus&&!d.focusDir) d.focusDir=d.focus.dir||null;
    if(!("activeTaskId" in d)) d.activeTaskId=(d.focus&&d.focus.stepTask)||null;
    delete d.focus;
    const OLDCAT={want:"другое",reading:"другое",watching:"другое",paused:"другое",done:"другое"};
    (d.media||[]).forEach(m=>{
      if(m.pinned===undefined) m.pinned = (m.status==="reading"||m.status==="watching");
      if(!m.cat) m.cat = m.genre || OLDCAT[m.status] || "другое";
      delete m.status; delete m.genre;
    });
    if(d.mediaFocus){
      if(d.mediaFocus.book){const b=(d.media||[]).find(x=>x.id===d.mediaFocus.book); if(b)b.pinned=true;}
      if(d.mediaFocus.film){const f=(d.media||[]).find(x=>x.id===d.mediaFocus.film); if(f)f.pinned=true;}
      delete d.mediaFocus;
    }
    if(!d.mediaCats) d.mediaCats=["научпоп","классика","жвачка для мозгов","языковое","хорроры","драма","комедия","по профессии","другое"];
    if(!d.menuCats) d.menuCats=["еда","прогулки","творчество","события","поездки","другое"];
    (d.reminders||[]).forEach(r=>{ if(r.status!=="active"&&!r.closedAt) r.closedAt=r.date; });
    d.settings=Object.assign({digestTime:"08:30",miss:"evening",tg:true,tgDigest:true,tgNudge:true,
      hardNotif:true,softNotif:true},d.settings||{});
    delete d.settings.touchOnComplete; delete d.settings.aiAuto;
    const need=["dirs","projects","tasks","touches","reminders","calendars","events","menu","media","inbox"];
    if(need.some(k=>!Array.isArray(d[k]))) return null;
    return d;
  }catch(e){ return null; }
}
function load(){
  let raw=null, migrated=false;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{ const parsed=JSON.parse(raw); migrated=parsed&&parsed.v!==3; DB=migrate(parsed); }
    catch(e){ DB=null; }
  }
  if(!DB){ DB=seedData(); migrated=!!raw; }
  if(migrated) save();   /* нормализуем хранилище сразу, чтобы старая форма не осталась на диске */
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }
function reset(){ DB=seedData(); save(); UI.route="home"; UI.stack=[]; render(); toast("Демо-данные вернулись к исходным"); }

function weekStart(d){const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(0,0,0,0); return x;}

const todayEvents=()=>DB.events.filter(e=>e.date===iso(TODAY)&&(DB.calendars.find(c=>c.id===e.cal)||{}).on);
const todayTasks=()=>DB.tasks.filter(t=>t.status==="open"&&t.deadline&&t.deadline<=iso(TODAY));
const remArchive=()=>DB.reminders.filter(r=>r.status!=="active"&&r.closedAt&&daysAgo(r.closedAt)<=7)

function setActive(id){

function go(route,param,push){

  UI.route=route; UI.param=param||null; render(); window.scrollTo(0,0);

function back(){

  render(); window.scrollTo(0,0);
}

/* ================= HEATMAP ================= */
function buildHeat(o){
  o=Object.assign({weeks:26,cell:12,gap:3,dir:null,months:true,side:true},o);
  const map={};
  DB.touches.forEach(t=>{ if(o.dir&&t.dir!==o.dir)return; (map[t.date]=map[t.date]||[]).push(t); });
  const end=weekStart(TODAY), start=addDays(end,-(o.weeks-1)*7);
  const wrap=el("div","heat-wrap"), inner=el("div");
  inner.style.display="flex"; inner.style.alignItems="flex-start";
  inner.style.setProperty("--hcell",o.cell+"px"); inner.style.setProperty("--hgap",o.gap+"px");
  if(o.side){ const side=el("div","heat-side");
    ["пн","","ср","","пт","",""].forEach(s=>side.appendChild(el("span",null,s)));
    if(!o.months) side.style.paddingTop="0"; inner.appendChild(side); }
  const colWrap=el("div");
  if(o.months){ const mrow=el("div","heat-months"); let last=-1;
    for(let w=0;w<o.weeks;w++){ const d=addDays(start,w*7), s=el("span"); s.style.width=o.cell+"px";
      if(d.getMonth()!==last&&d.getDate()<=7){ s.textContent=MONS[d.getMonth()]; last=d.getMonth(); }
      mrow.appendChild(s); }
    mrow.style.setProperty("--hgap",o.gap+"px"); colWrap.appendChild(mrow); }
  const grid=el("div","heat"); grid.style.setProperty("--hgap",o.gap+"px");
  for(let w=0;w<o.weeks;w++){
    const col=el("div","heat-col"); col.style.setProperty("--hgap",o.gap+"px");
    for(let dd=0;dd<7;dd++){
      const d=addDays(start,w*7+dd), key=iso(d), c=el("div","heat-cell");
      c.style.setProperty("--hcell",o.cell+"px");
      if(d>TODAY){ c.classList.add("future"); col.appendChild(c); continue; }
      const list=map[key];
      if(list&&list.length){
        c.dataset.n=list.length; c.dataset.date=key; if(o.dir) c.dataset.dir=o.dir;
        const uniq=[...new Set(list.map(t=>t.dir))];
        if(uniq.length===1){ c.style.background=rgba(dcol(uniq[0]),list.length>=3?.95:list.length===2?.7:.48); }
        else{ const step=100/uniq.length;
          c.style.background="conic-gradient("+uniq.map((u,k)=>rgba(dcol(u),.9)+" "+(k*step)+"% "+((k+1)*step)+"%").join(",")+")"; }
      }
      col.appendChild(c);
    }
    grid.appendChild(col);
  }
  colWrap.appendChild(grid); inner.appendChild(colWrap); wrap.appendChild(inner);
  return wrap;
}
function heatSlots(root){ root.querySelectorAll("[data-heat]").forEach(n=>n.appendChild(buildHeat(JSON.parse(n.dataset.heat)))); }
function legendEl(){ const l=el("div","legend");
  DB.dirs.forEach(d=>{ const b=el("b"), dot=el("span","dot"); dot.style.background="var("+d.color+")";

function todayHTML(){
  const ev=todayEvents().slice().sort((a,b)=>a.time<b.time?-1:1);
  const tk=todayTasks(), rem=todayReminders();
  const remTimed=rem.filter(r=>r.time).sort((a,b)=>a.time<b.time?-1:1);
  const remSoft=rem.filter(r=>!r.time);
  const total=ev.length+tk.length+rem.length;
  let h='<div class="today"><div class="today-h"><div><div class="lbl">Сегодня</div>'+
    '<div class="hint" style="margin-top:3px">'+(total? total+" "+plural(total,"пункт","пункта","пунктов")+" — события, сроки и напоминания"
      :"Ничего обязательного на сегодня")+"</div></div>"+
    '<div style="display:flex;gap:14px;flex:none">'+
    '<button class="quiet-link" data-nav="reminders">Все напоминания</button>'+
    '<button class="quiet-link" data-act="remarch">Архив за 7 дней</button></div></div>';
  if(!total){
    h+='<div style="padding:18px;border-top:1px solid var(--line)"><p class="hint">Свободный день. Можно взять что-нибудь из фокуса или ничего не брать.</p></div></div>';
    return h;
  }
  const rows=[];
  ev.forEach(e=>rows.push({t:e.time,html:trowEvent(e)}));
  tk.forEach(t=>rows.push({t:t.time||"23:59",html:trowTask(t)}));
  remTimed.forEach(r=>rows.push({t:r.time,html:trowRem(r)}));
  rows.sort((a,b)=>a.t<b.t?-1:1);
  h+=rows.map(r=>r.html).join("");
  if(remSoft.length){
    h+='<div class="tgroup"><span class="lbl">'+I.bell+" Не забыть сегодня</span>";
    h+=remSoft.map(r=>'<div class="tg-item"><button class="check" data-rdone="'+r.id+'">'+I.check+"</button>"+
       '<span style="flex:1;font-size:13.5px">'+esc(r.text)+"</span>"+
       '<button class="btn btn-ghost btn-sm" data-rem="'+r.id+'">Ещё</button></div>').join("");
    h+="</div>";
  }
  return h+"</div>";
}

function vDirection(id){
  const d=dir(id); if(!d) return vDirections();
  const at=activeTask();
  const all=dirProjects(id);
  const hasHot=p=>(at&&at.project===p.id)||openTasks(p.id).some(t=>t.pinned);
  const hot=all.filter(p=>p.status==="active"&&hasHot(p));
  const rest=all.filter(p=>p.status==="active"&&!hasHot(p));
  const paused=all.filter(p=>p.status==="paused");
  const arch=all.filter(p=>p.status==="archived");
  const tt=dirTouches(id);
  let h=backBtn("Направления");
  h+='<div class="page-head"><div style="display:flex;gap:14px;align-items:center">'+glyphHTML(id,true)+
    '<div><h1 class="page-title" style="font-size:29px">'+esc(d.name)+"</h1>"+
    (d.showMotto&&d.motto?'<p class="page-sub" style="font-style:italic;font-size:14.5px">«'+esc(d.motto)+"»</p>":
      '<p class="page-sub">'+esc(d.description||"")+"</p>")+"</div></div>"+
    '<div style="display:flex;gap:8px;flex:none;flex-wrap:wrap">'+
    '<button class="btn btn-sm" data-act="dirset" data-dir="'+id+'">Настроить</button>'+
    (DB.focusDir===id?'<button class="btn btn-sm btn-ghost" data-clearfocus>Убрать из фокуса</button>'
      :'<button class="btn btn-sm" data-focusdir="'+id+'">Поставить в фокус</button>')+

  /* карта + последние касания в одной карточке */

function projCard(p,hot,flat){
  const at=activeTask();
  const pins=openTasks(p.id).filter(t=>t.pinned).length;
  let h='<button class="card" style="display:block;width:100%;text-align:left;margin-bottom:10px'+
    (hot?"":";background:transparent")+(flat?";border-style:dashed":"")+'" data-go="project:'+p.id+'">';
  h+='<div style="font-family:Literata,serif;font-size:'+(hot?"17px":"15.5px")+'">'+esc(p.title)+
     (p.status==="paused"?' <span class="quiet" style="margin-left:6px">на паузе</span>':"")+"</div>";
  if(p.outcome) h+='<p class="hint" style="margin-top:5px;max-width:70ch">'+esc(p.outcome)+"</p>";

function tlineHTML(t,d){
  const isAct=DB.activeTaskId===t.id;
  const done=t.checklist.filter(c=>c.done).length;
  let meta="";
  if(t.deadline) meta+="<i>"+I.clock+"до "+longDate(t.deadline)+(t.time?", "+t.time:"")+"</i>";
  if(t.est) meta+="<i>"+ESTSHORT[t.est]+"</i>";
  if(t.checklist.length) meta+="<i>"+done+" из "+t.checklist.length+"</i>";
  return '<div class="tline'+(isAct?" act":"")+'" style="--tc:var('+d.color+')">'+
   '<button class="check" data-tdone="'+t.id+'" style="margin-top:1px">'+I.check+"</button>"+
   '<button class="tline-main" data-go="task:'+t.id+'">'+
   '<div class="tline-title">'+esc(t.title)+(isAct?' <span class="quiet" style="margin-left:5px">сейчас</span>':"")+"</div>"+
   (meta?'<div class="tline-meta">'+meta+"</div>":"")+"</button>"+
   '<button class="pinbtn'+(t.pinned?" on":"")+'" data-pin="'+t.id+'" title="'+(t.pinned?"Открепить":"Закрепить")+'">'+
   (t.pinned?I.pinOn:I.pin)+"</button></div>";
}

function vReminders(){
  const act=DB.reminders.filter(r=>r.status==="active");
  const today=act.filter(r=>r.date<=iso(TODAY));
  const soon=act.filter(r=>r.date>iso(TODAY)&&!r.repeat);
  const rep=act.filter(r=>r.repeat);
  const noTime=act.filter(r=>!r.time&&r.date<=iso(TODAY));
  let h='<div class="page-head"><div><h1 class="page-title">Напоминания</h1>'+
   '<p class="page-sub">Внешняя память. Не задачи и не проекты — мелочь, которую не нужно держать в голове.</p></div>'+
   '<div style="display:flex;gap:8px"><button class="btn btn-sm" data-act="remarch">'+I.arch+"Архив</button>"+
   '<button class="btn btn-primary" data-act="remind">'+I.plus+"Напомнить</button></div></div>";
  h+='<div style="max-width:760px">';
  h+=remSection("Сегодня",today,"Сегодня ничего не ждёт.");
  h+=remSection("Ближайшие",soon,"Впереди пусто.");
  h+=remSection("Регулярные",rep,"Регулярных нет.");
  if(noTime.length){
    h+='<div style="margin-bottom:18px"><span class="lbl">Без точного времени · придут в сводке в '+DB.settings.digestTime+"</span>"+
       '<p class="hint" style="margin-top:6px">'+noTime.map(r=>esc(r.text)).join(" · ")+"</p></div>";

function remSection(title,list,emptyText){

  return h+list.map(r=>remCard(r)).join("")+"</div>";
}

     (r.source==="telegram"?'<span class="tag" style="color:var(--tg)">'+I.tg+"Telegram</span>":'<span class="tag">приложение</span>')+

      '</span><span class="tag">'+esc(m.cost)+'</span><span class="tag">'+esc(m.place)+'</span><span class="tag">'+esc(m.company)+"</span></div>"+
      '<div class="mcard-foot"><button class="btn btn-sm btn-ghost" data-mtried="'+m.id+'">'+(m.tried?"Убрать отметку":"Попробовала")+"</button>"+
      '<div style="display:flex;gap:5px"><button class="btn btn-sm btn-ghost" data-editmenu="'+m.id+'">Изменить</button>'+
      '<button class="btn btn-sm btn-ghost btn-danger" data-delmenu="'+m.id+'">'+I.x+"</button></div></div></div>";

function emptyBlock(title,text,act,btn){

/* ================= КНИГИ И ФИЛЬМЫ ================= */
function coverBg(m){
  const pal=m.kind==="book"?["eng","act","vocal"]:["phys","vocal","act"];
  const k=(m.title.charCodeAt(0)+m.title.length)%pal.length;
  const a=pal[k], b=pal[(k+1)%pal.length];
  return "linear-gradient(155deg,"+rgba(dcol(a),.34)+" 0%,"+rgba(dcol(b),.16)+" 100%)";
}
function starsHTML(n){let s="";for(let i=1;i<=5;i++)s+= i<=n?I.star:I.starO; return s;}
function mediaCard(m,extraClass){
  const grad=coverBg(m);
  return '<div class="mitem'+(extraClass?" "+extraClass:"")+'"><div style="position:relative">'+
   '<button class="cover" style="background:'+grad+'" data-go="media:'+m.id+'">'+
   '<span class="init">'+esc(m.title.charAt(0))+'</span><span class="em">'+m.emoji+"</span></button>"+
   '<button class="pinfab'+(m.pinned?" on":"")+'" data-mpin="'+m.id+'" title="'+(m.pinned?"Открепить":"Закрепить")+'">'+
   (m.pinned?I.pinOn:I.pin)+"</button></div>"+
   '<div><div class="mtitle">'+esc(m.title)+'</div><div class="mauthor">'+esc(m.author)+"</div>"+
   '<div class="quiet" style="margin-top:4px">'+esc(m.cat)+"</div></div></div>";
}

const ITYPES=[["task","Задача"],["project","Проект"],["reminder","Напоминание"],["menu","Идея меню"],
 ["book","Книга"],["film","Фильм или сериал"],["note","Заметка в проект"],["keep","Оставить во входящих"]];
function vInbox(){

   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="thought">'+I.plus+"Мысль</button>"+

  h+='<div style="max-width:820px">';
  DB.inbox.forEach(it=>{
    const st=it.draft||{type:"keep",dir:"",project:"",deadline:"",remindAt:"",est:"",comment:"",text:it.text};
    h+='<div class="inbox-item"><div class="inbox-txt">'+esc(it.text)+"</div>";
    h+='<div class="row-sub" style="margin-top:6px">'+(it.source==="telegram"?'<span class="tag" style="color:var(--tg)">'+I.tg+"Telegram</span>":'<span class="tag">приложение</span>')+
       '<span class="mono hint">'+esc(it.at)+"</span></div>";
    h+='<div class="inbox-grid">';
    h+='<div class="ffield"><span class="lbl">Тип</span><select data-idraft="'+it.id+':type">'+
       ITYPES.map(t=>'<option value="'+t[0]+'"'+(st.type===t[0]?" selected":"")+">"+t[1]+"</option>").join("")+"</select></div>";
    if(st.type==="task"||st.type==="note"){
      h+='<div class="ffield"><span class="lbl">Проект (определяет направление)</span><select data-idraft="'+it.id+':project">'+
         '<option value="">— выбери проект —</option>'+
         DB.projects.filter(p=>p.status!=="archived").map(p=>'<option value="'+p.id+'"'+(st.project===p.id?" selected":"")+">"+esc(dir(p.dir).name)+" · "+esc(p.title)+"</option>").join("")+"</select></div>";
    }
    if(st.type==="task"){
      h+='<div class="ffield"><span class="lbl">Дедлайн (необязательно)</span><input type="date" data-idraft="'+it.id+':deadline" value="'+esc(st.deadline)+'"></div>';
      h+='<div class="ffield"><span class="lbl">Примерно займёт</span><select data-idraft="'+it.id+':est"><option value="">не знаю</option>'+
         Object.keys(EST).map(k=>'<option value="'+k+'"'+(st.est===k?" selected":"")+">"+EST[k]+"</option>").join("")+"</select></div>";
    }
    if(st.type==="reminder"){
      h+='<div class="ffield"><span class="lbl">Когда напомнить</span><input type="date" data-idraft="'+it.id+':remindAt" value="'+esc(st.remindAt)+'"></div>';
      h+='<div class="ffield"><span class="lbl">Как</span><select data-idraft="'+it.id+':delivery">'+
         '<option value="digest"'+(st.delivery!=="alert"?" selected":"")+">в дневной сводке</option>"+
         '<option value="alert"'+(st.delivery==="alert"?" selected":"")+">отдельным уведомлением</option></select></div>";
    }
    h+='<div class="ffield" style="grid-column:1/-1"><span class="lbl">Формулировка</span><input type="text" data-idraft="'+it.id+':text" value="'+esc(st.text)+'"></div>';
    h+='<div class="ffield" style="grid-column:1/-1"><span class="lbl">Комментарий</span><input type="text" data-idraft="'+it.id+':comment" value="'+esc(st.comment)+'"></div>';
    h+="</div>";
    h+='<div style="display:flex;gap:7px;margin-top:14px;flex-wrap:wrap">'+
       '<button class="btn btn-sm btn-primary" data-isave="'+it.id+'">Сохранить</button>'+
       '<button class="btn btn-sm btn-ghost btn-danger" data-idel="'+it.id+'">Удалить</button></div>';
    h+="</div>";
  });
  h+="</div>";
  return h;
}

  h+='<div class="page-head"><div><h1 class="page-title">Журнал и статистика</h1>'+

     [["feed","Лента"],["map","Карта"],["week","По неделям"]].map(x=>'<button class="'+(UI.statView===x[0]?"on":"")+'" data-statview="'+x[0]+'">'+x[1]+"</button>").join("")+"</div></div>";
  h+='<div class="fset"><span class="lbl">Направление</span><div class="fgroup">'+
     '<button class="'+(UI.statDir==="all"?"on":"")+'" data-statdir="all">все</button>'+

  if(!list.length) return h+emptyBlock("Пока пусто","Журнал наполняется сам, когда ты отмечаешь касания.",null);
  if(UI.statView==="map"){
    h+='<div class="card"><div class="card-h"><div class="lbl">Полгода</div><div class="mono hint">'+list.length+" касаний</div></div>"+
      '<div data-heat=\'{"weeks":26,"cell":16,"gap":4'+(UI.statDir!=="all"?',"dir":"'+UI.statDir+'"':"")+'}\'></div>'+
      (UI.statDir==="all"?'<div data-legend></div>':"")+"</div>";
    const per={}; list.forEach(t=>per[t.dir]=(per[t.dir]||0)+1);
    h+='<div class="card" style="margin-top:16px"><div class="lbl" style="margin-bottom:12px">Касания по направлениям</div><div style="display:flex;gap:26px;flex-wrap:wrap">'+
      DB.dirs.filter(d=>per[d.id]).map(d=>'<div><b class="mono" style="font-size:19px;display:block">'+per[d.id]+"</b>"+
      '<span class="hint">'+esc(d.name)+"</span></div>").join("")+"</div></div>";
    return h;
  }
  if(UI.statView==="week"){
    const wk={}; list.forEach(t=>{const k=iso(weekStart(parse(t.date))); (wk[k]=wk[k]||[]).push(t);});
    h+='<div class="stack" style="gap:11px">';
    Object.keys(wk).sort().reverse().slice(0,14).forEach(k=>{
      const arr=wk[k], byd={}; arr.forEach(t=>byd[t.dir]=(byd[t.dir]||0)+1);
      const ws=parse(k), we=addDays(ws,6);
      h+='<div class="card" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">'+
        '<div><div style="font-family:Literata,serif;font-size:15px">'+ws.getDate()+" – "+we.getDate()+" "+MONF[we.getMonth()]+"</div>"+
        '<div class="row-sub" style="margin-top:3px">'+arr.length+" "+plural(arr.length,"касание","касания","касаний")+"</div></div>"+
        '<div style="display:flex;gap:12px;flex-wrap:wrap">'+Object.keys(byd).map(x=>'<span class="chipdir"><i class="dot" style="background:var('+dir(x).color+')"></i>'+
        esc(dir(x).name)+' <b class="mono" style="color:var(--text-3);font-weight:500">'+byd[x]+"</b></span>").join("")+"</div></div></div>";
    });
    return h+"</div>";
  }
  const byDay={}; list.forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
  h+='<div class="card" style="padding:4px 18px 12px">';
  Object.keys(byDay).sort().reverse().slice(0,50).forEach(k=>{
    const d=parse(k), rel=daysAgo(k)<7?" · "+human(k):"";
    h+='<div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:13px 0;border-top:1px solid var(--line)">'+
      '<div class="mono hint" style="padding-top:2px"><b style="display:block;color:var(--text);font-size:13px">'+d.getDate()+" "+MON[d.getMonth()]+"</b>"+DOWS[d.getDay()]+rel+"</div><div>";
    byDay[k].forEach(t=>{ h+='<div style="display:flex;gap:10px;align-items:baseline;padding:4px 0">'+
      '<i style="width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:16px;background:var('+dir(t.dir).color+')"></i>'+
      '<span style="flex:1">'+esc(t.title)+"</span>"+
      (t.project?'<span class="hint">'+esc(proj(t.project)?proj(t.project).title:"")+"</span>":"")+"</div>"; });
    h+="</div></div>";
  });
  return h+"</div>";
}

function defaultTgLog(){

   {who:"bot",text:"Привет. Пиши что угодно — мысль попадёт во «Входящие», а «напомни…» станет напоминанием."},

  ];
}
const WD={"понедельник":1,"вторник":2,"среду":3,"среда":3,"четверг":4,"пятницу":5,"пятница":5,"субботу":6,"суббота":6,"воскресенье":0};
const MONNAMES={"января":0,"февраля":1,"марта":2,"апреля":3,"мая":4,"июня":5,"июля":6,"августа":7,"сентября":8,"октября":9,"ноября":10,"декабря":11};
const DOWACC=["воскресенье","понедельник","вторник","среду","четверг","пятницу","субботу"];
function parsePhrase(raw){
  const low=raw.toLowerCase().trim(); const orig=raw.trim();
  const cuts=[]; const cut=m=>{ cuts.push([m.index,m[0].length]); };
  const isRem=/(^|\s)(напомни|напомнить|напомните)(\s|$)/.test(low);
  let m;
  if((m=low.match(/(^|\s)(напомни|напомнить|напомните)(\s|$)/))) cut(m);
  let date=null,time=null,ambiguousWd=null;
  if((m=low.match(/(^|\s)в\s+(\d{1,2})(?::(\d{2}))?(\s|$)/))){ time=pad(+m[2])+":"+(m[3]||"00"); cut(m); }
  if((m=low.match(/сегодня/))){ date=iso(TODAY); cut(m); }
  else if((m=low.match(/послезавтра/))){ date=D(2); cut(m); }
  else if((m=low.match(/завтра/))){ date=D(1); cut(m); }
  else if((m=low.match(/через\s+(\d+|две|три|неделю|месяц)\s*(дня|дней|день|недели|неделю|недель|месяца?)?/))){
    const nmap={"две":2,"три":3}; const n=nmap[m[1]]||parseInt(m[1],10)||1;
    const unit=m[2]||m[1];
    date=D(/недел/.test(unit)?n*7:/месяц/.test(unit)?30:n); cut(m);
  }
  else if((m=low.match(/(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/))){
    const y=TODAY.getFullYear(); let dt=new Date(y,MONNAMES[m[2]],+m[1]);
    if(dt<TODAY) dt=new Date(y+1,MONNAMES[m[2]],+m[1]);
    date=iso(dt); cut(m);
  }
  else if((m=low.match(/(^|\s)в\s+(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье)/))){
    const target=WD[m[2]]; let dt=TODAY;
    for(let i=1;i<=7;i++){ const c=addDays(TODAY,i); if(c.getDay()===target){dt=c;break;} }
    date=iso(dt); ambiguousWd=DOWACC[target]; cut(m);
  }
  cuts.sort((x,y)=>y[0]-x[0]);
  let text=orig;
  cuts.forEach(c=>{ text=text.slice(0,c[0])+" "+text.slice(c[0]+c[1]); });
  text=text.replace(/\s+/g," ").replace(/^[\s,\u2013\u2014-]+/,"").replace(/[\s,.]+$/,"");
  text=text.charAt(0).toUpperCase()+text.slice(1);
  return {isRem:isRem,date:date,time:time,text:text||raw,ambiguousWd:ambiguousWd};
}
function tgSend(raw){
  if(!raw.trim()) return;
  UI.tgLog.push({who:"me",text:raw});
  const p=parsePhrase(raw);
  if(!p.isRem){
    DB.inbox.unshift({id:uid("i"),text:raw,source:"telegram",at:"только что"}); save();
    UI.tgLog.push({who:"bot",text:"Сохранил во входящие. Ничего делать не надо.",
      btns:[{label:"В меню",act:"tomenu",payload:raw},{label:"Это книга",act:"tobook",payload:raw},{label:"Разобрать позже",act:"later"}]});
  } else if(p.ambiguousWd){
    UI.tgLog.push({who:"bot",text:"Ты имеешь в виду "+p.ambiguousWd+", "+longDate(p.date)+"?",
      btns:[{label:"Да",act:"confirm",payload:p},{label:"Выбрать другую дату",act:"pickdate",payload:p},{label:"Отменить",act:"cancel"}]});
  } else if(!p.date){
    UI.tgLog.push({who:"bot",text:"Когда напомнить: «"+esc(p.text)+"»?",
      btns:[{label:"Сегодня вечером",act:"set",payload:Object.assign({},p,{date:iso(TODAY),time:"20:00"})},
            {label:"Завтра",act:"set",payload:Object.assign({},p,{date:D(1)})},
            {label:"Выбрать дату",act:"pickdate",payload:p},{label:"Отменить",act:"cancel"}]});
  } else {
    createReminderFromPhrase(p);
    UI.tgLog.push({who:"bot",text:"Напомню "+longDate(p.date)+(p.time?" в "+p.time:" в утренней сводке")+": «"+esc(p.text)+"».",
      btns:[{label:"Изменить время",act:"time",payload:p},{label:"Отменить",act:"cancelLast"}]});
  }
  render();
  setTimeout(()=>{const el2=document.getElementById("tgphone"); if(el2) el2.scrollTop=el2.scrollHeight;},40);
}
function createReminderFromPhrase(p){
  const r={id:uid("r"),text:p.text,date:p.date,time:p.time||null,delivery:p.time?"alert":"digest",repeat:null,
    source:"telegram",comment:"",status:"active",miss:DB.settings.miss,createdAt:iso(TODAY)};
  DB.reminders.push(r); save(); return r;
}

const PROJ_HINT=[[/демо|озвуч|ролик|микрофон/,"pr-demo"],[/монолог|офели|сцен|этюд/,"pr-ophelia"],
 [/headshot|фото|резюме|агент/,"pr-head"],[/курс.*британ|британ|школ/,"pr-uk"],
 [/джон|домашн|английск|cae|эссе/,"pr-john"],[/физик|мфти|механик|лекци/,"pr-mipt"],[/пес|вокал|распев|укулел/,"pr-prog"]];
function aiProposal(it){
  const s=it.text.toLowerCase();
  const clean=x=>{x=x.replace(/^(завтра |сегодня |послезавтра |может,? |кто-то советовал |говорят,? )+/gi,"")
    .replace(/надо не забыть|не забыть|напомни(ть)?|\bнадо\b|\bнужно\b/gi,"")
    .replace(/,?\s*говорят стоит\.?$/i,"").replace(/\s+/g," ").replace(/^[\s,]+|[\s,]+$/g,"");
    return x.charAt(0).toUpperCase()+x.slice(1);};
  const quoted=()=>{const q=it.text.match(/[«"]([^»"]{2,})[»"]/); return q?q[1]:null;};
  const base={id:it.id,on:true,type:"keep",text:clean(it.text),project:"",deadline:"",remindAt:"",delivery:"digest",
    comment:"",note:"",merge:""};
  if(/не забыть|напомни|забрать|оплатить|позвонить|записаться|химчистк/.test(s)){
    const p=parsePhrase("напомни "+s);
    base.type="reminder"; base.text=clean(p.text);
    if(p.date){ base.remindAt=p.date; base.note="Дата взята из текста: "+longDate(p.date)+"."; }
    else base.note="Даты в тексте нет — придумывать не буду, выбери сама.";
    base.delivery=p.time?"alert":"digest";
    return base;
  }
  if(/посмотреть|фильм|сериал|кино|дзеффирелли/.test(s)){
    base.type="film"; base.text=quoted()||base.text; base.note="Похоже на фильм — отправлю на полку, без срока."; return base;
  }
  if(/книг|прочитать|почитать|советовал.*«/.test(s)){
    base.type="book"; base.text=quoted()||base.text.replace(/^книг[уаи]\s*/i,""); base.note="Похоже на книгу. Статус: «хочу прочитать»."; return base;
  }
  if(/сходить|выставк|поесть|погулять|съездить|концерт|маникюр|лошад/.test(s)){
    base.type="menu"; base.note="Приятное и необязательное — это меню, а не задача."; return base;
  }
  for(const r of PROJ_HINT){ if(r[0].test(s)){ base.type="task"; base.project=r[1];
    base.note="Подходит к проекту «"+proj(r[1]).title+"». Дедлайна в тексте нет, значит в бэклог."; return base; } }
  base.type="keep"; base.note="Не понимаю, к чему это отнести. Оставлю во входящих.";
  return base;
}

function applyProposal(b){
  const src=DB.inbox.find(x=>x.id===b.id);
  if(b.type==="keep") return false;
  if(b.type==="reminder"){
    if(!b.remindAt){ toast("У напоминания «"+b.text+"» нет даты — выбери её"); return false; }
    DB.reminders.push({id:uid("r"),text:b.text,date:b.remindAt,time:null,delivery:b.delivery||"digest",repeat:null,
      source:src?src.source==="telegram"?"telegram":"app":"app",comment:b.comment||"",status:"active",miss:DB.settings.miss,createdAt:iso(TODAY)});
  } else if(b.type==="task"){
    if(!b.project){ toast("Для задачи «"+b.text+"» нужен проект"); return false; }
    DB.tasks.push({id:uid("t"),project:b.project,title:b.text,status:"open",pinned:false,
      deadline:b.deadline||null,time:null,est:b.est||null,comment:b.comment||"",checklist:[],remindAt:null,doneAt:null});
  } else if(b.type==="project"){
    const dirId=DB.focusDir||DB.dirs[0].id;
    DB.projects.push({id:uid("pr"),dir:dirId,title:b.text,outcome:b.comment||"",status:"paused",deadline:null,
      createdAt:iso(TODAY),doneAt:null,notes:[]});
  } else if(b.type==="menu"){
    DB.menu.push({id:uid("m"),title:b.text,cat:DB.menuCats[DB.menuCats.length-1],energy:"средне",time:"около часа",
      cost:"недорого",place:"вне дома",company:"всё равно",comment:b.comment||"",link:"",tried:false});
  } else if(b.type==="book"||b.type==="film"){
    DB.media.push({id:uid(b.type==="book"?"b":"f"),kind:b.type,title:b.text,author:"",cat:"другое",pinned:false,
      emoji:b.type==="book"?"📗":"🎬",comment:b.comment||"",link:"",startedAt:null,rating:0});
  } else if(b.type==="note"){
    if(!b.project){ toast("Для заметки нужен проект"); return false; }
    proj(b.project).notes.push(b.text);
  }
  DB.inbox=DB.inbox.filter(x=>x.id!==b.id);
  return true;
}

  let h='<div class="lbl" style="margin-bottom:4px">'+d.getDate()+" "+MONF[d.getMonth()]+"</div>";
  h+=list.map(t=>'<div style="display:flex;gap:6px;align-items:baseline"><i style="width:6px;height:6px;border-radius:2px;background:'+
    dcol(t.dir)+';display:inline-block;flex:none"></i>'+esc(t.title)+"</div>").join("");
  tipEl().innerHTML=h; tipEl().classList.add("show");
  const r=c.getBoundingClientRect(), tw=tipEl().offsetWidth;
  tipEl().style.left=Math.max(8,Math.min(window.innerWidth-tw-8,r.left+r.width/2-tw/2))+"px";
  tipEl().style.top=(r.top-tipEl().offsetHeight-8)+"px";
});
document.addEventListener("mouseout",e=>{ if(e.target.closest(".heat-cell")) tipEl().classList.remove("show"); });

/* ================= РЕНДЕР ================= */
function render(){
  const m=$("#main"); let h="";
  switch(UI.route){
    case "home": h=vHome(); break;
    case "directions": h=vDirections(); break;
    case "direction": h=vDirection(UI.param); break;
    case "project": h=vProject(UI.param); break;
    case "task": h=vTask(UI.param); break;
    case "reminders": h=vReminders(); break;
    case "menu": h=vMenu(); break;
    case "media": h=UI.param?vMediaItem(UI.param):vMedia(); break;
    case "inbox": h=vInbox(); break;
    case "settings": h=vSettings(); break;
    case "stats": h=vStats(); break;
    default: h=vHome();
  }
  m.innerHTML=h;
  heatSlots(m);
  m.querySelectorAll("[data-legend]").forEach(n=>n.appendChild(legendEl()));
  renderNav();
  if(UI.justPinned) setTimeout(()=>{ UI.justPinned=null; },400);
}

/* ================= СОБЫТИЯ ================= */
function completeTask(id){
  const t=task(id); if(!t) return;
  t.status="done"; t.doneAt=iso(TODAY); t.pinned=false;
  if(DB.activeTaskId===id) DB.activeTaskId=null;
  save();
}
document.addEventListener("click",function(e){
  const t=e.target; let n;
  const hit=a=>t.closest("["+a+"]");

  if((n=hit("data-nav"))){ navTo(n.dataset.nav); return; }
  if((n=hit("data-go"))){ const p=n.dataset.go.split(":"); go(p[0],p[1]||null); return; }
  if((n=hit("data-back"))){ back(); return; }
  if((n=hit("data-theme-set"))){ document.documentElement.setAttribute("data-theme",n.dataset.themeSet); render(); return; }
  if(t.classList&&t.classList.contains("scrim")){ closeModal(); return; }
  if((n=hit("data-close"))){ closeModal(); return; }

  if((n=hit("data-act"))){
    const a=n.dataset.act;
    if(a==="touch") modalTouch(n.dataset.dir,n.dataset.proj);

    else if(a==="remind") modalRemind(null);

    else if(a==="addnote") modalPrompt("Заметка проекта","Текст","note:"+n.dataset.id);
    else if(a==="addcheck") modalPrompt("Пункт чек-листа","Текст","check:"+n.dataset.id);
    else if(a==="dirset") modalDirSettings(n.dataset.dir);
    else if(a==="newdir") modalNewDir();
    else if(a==="newmenu") modalMenu(null);
    else if(a==="cats") modalCats();
    else if(a==="mediacats") modalMediaCats();
    else if(a==="newmedia") modalMedia();
    else if(a==="aibatch") startAiBatch();

  /* задачи */

  if((n=hit("data-pin"))){
    const tk=task(n.dataset.pin); tk.pinned=!tk.pinned; save(); render();

  }
  if((n=hit("data-setactive"))){ setActive(n.dataset.setactive); render(); toast("Теперь это активная задача"); return; }
  if((n=hit("data-clearactive"))){ DB.activeTaskId=null; save(); render(); toast("Активной задачи нет"); return; }
  if((n=hit("data-pickactive"))){ modalPickTask(n.dataset.pickactive||null,"active"); return; }
  if((n=hit("data-pickpin"))){ modalPickTask(n.dataset.pickpin||null,"pin"); return; }
  if((n=hit("data-choosetask"))){
    const p=n.dataset.choosetask.split(":"), tk=task(p[1]);

    else if(b.act==="evening"){ todayReminders().forEach(r=>{ r.time="20:00"; r.delivery="alert"; }); save();

    else if(b.act==="tobook"){ DB.media.push({id:uid("b"),kind:"book",title:b.payload,author:"",cat:"другое",pinned:false,

    render(); setTimeout(()=>{const p2=document.getElementById("tgphone"); if(p2)p2.scrollTop=p2.scrollHeight;},40);

  if((n=hit("data-save"))){ handleSave(n.dataset.save); return; }

function refreshChips(node,attr){
  const wrap=node.closest(".chips"); if(!wrap) return;
  wrap.querySelectorAll("[data-"+attr+"]").forEach(b=>b.classList.toggle("on",b===node));
}

function handleSave(key){
  const parts=key.split(":"), k=parts[0], id=parts[1]||"";
  if(k==="touch"){
    const title=val("tc-title"); if(!title){ toast("Напиши пару слов о том, что было"); return; }
    DB.touches.unshift({id:uid("h"),dir:M.dir,project:val("tc-proj")||null,date:D(-Number(M.day||0)),
      title:title,comment:val("tc-comment")});
    DB.touches.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
    save(); closeModal(); render(); toast("Записано. Появился новый квадрат.");
  }
  else if(k==="thought"){
    const v=val("th-text"); if(!v){ closeModal(); return; }
    DB.inbox.unshift({id:uid("i"),text:v,source:"приложение",at:"только что"});
    save(); closeModal(); render(); toast("Сохранил во входящие. Ничего делать не надо.");
  }
  else if(k==="remind"){
    const text=val("rm-text"); if(!text){ toast("О чём напомнить?"); return; }
    const date=val("rm-date")||iso(TODAY), time=val("rm-time");
    const delivery=time?(M.delivery||"alert"):"digest";
    const obj={text:text,date:date,time:time||null,delivery:delivery,repeat:M.repeat||null,
      comment:val("rm-comment"),miss:M.miss||DB.settings.miss};
    if(M.remId){ Object.assign(DB.reminders.find(x=>x.id===M.remId),obj); }
    else DB.reminders.push(Object.assign({id:uid("r"),source:"приложение",status:"active",createdAt:iso(TODAY)},obj));
    M.remId=null; M.delivery=undefined; M.repeat=undefined; M.miss=undefined;
    save(); closeModal(); render();
    toast(time?"Напомню "+longDate(date)+" в "+time:"Напомню "+longDate(date)+" в сводке в "+DB.settings.digestTime);
  }
  else if(k==="project"){
    const title=val("pj-title"); if(!title){ toast("Нужно название"); return; }
    const obj={title:title,outcome:val("pj-outcome"),dir:M.pdir,status:M.pstat,deadline:val("pj-deadline")||null};
    if(id){ Object.assign(proj(id),obj); toast("Проект обновлён"); }
    else { DB.projects.push(Object.assign({id:uid("pr"),createdAt:iso(TODAY),doneAt:null,notes:[]},obj)); toast("Проект создан"); }
    save(); closeModal(); render();
  }
  else if(k==="finish"){
    const p=proj(id); p.status="archived"; p.doneAt=iso(TODAY);
    projTasks(id).forEach(t=>{ if(t.status==="open"){t.status="done"; t.doneAt=iso(TODAY); t.pinned=false;} });
    let msg="Проект в архиве. Касания остались в статистике направления.";
    const at=activeTask();
    if(at&&at.project===id){ DB.activeTaskId=null; msg+=" Активной задачи больше нет."; }
    save(); closeModal(); go("direction",p.dir); toast(msg);
  }
  else if(k==="task"){
    const title=val("nt-title"); if(!title){ toast("Нужно название"); return; }
    DB.tasks.push({id:uid("t"),project:id,title:title,status:"open",pinned:false,
      deadline:val("nt-deadline")||null,time:null,est:val("nt-est")||null,comment:"",checklist:[],remindAt:null,doneAt:null});
    save(); closeModal(); render(); toast("Задача создана");
  }
  else if(k==="note"){ const v=val("pr-text"); if(v){ proj(id).notes.push(v); save(); } closeModal(); render(); }
  else if(k==="check"){ const v=val("pr-text"); if(v){ task(id).checklist.push({t:v,done:false}); save(); } closeModal(); render(); }
  else if(k==="dirset"){
    const d=dir(id);
    d.name=val("ds-name")||d.name; d.description=val("ds-desc"); d.motto=val("ds-motto");
    d.showMotto=chk("ds-show"); d.color=M.dcolor; d.icon=M.dicon;
    save(); closeModal(); render(); toast("Направление обновлено");
  }
  else if(k==="newdir"){
    const name=val("nd-name"); if(!name){ toast("Нужно название"); return; }
    DB.dirs.push({id:uid("d"),name:name,icon:M.dicon,color:M.dcolor,motto:val("nd-motto"),
      showMotto:!!val("nd-motto"),description:val("nd-desc")});
    save(); closeModal(); render(); toast("Направление создано");
  }
  else if(k==="menu"){
    const title=val("mn-title"); if(!title){ toast("Нужно название"); return; }
    const obj={title:title,cat:M.mcat,energy:M.men,time:M.mtime,cost:M.mcost,place:M.mplace,company:M.mcomp,
      comment:val("mn-comment"),link:val("mn-link")};
    if(id) Object.assign(DB.menu.find(x=>x.id===id),obj);
    else DB.menu.push(Object.assign({id:uid("m"),tried:false},obj));
    save(); closeModal(); render(); toast("Сохранено. Срока у этого нет.");
  }
  else if(k==="cats"){
    const list=val("ct-list").split(",").map(x=>x.trim()).filter(Boolean);
    if(list.length) DB.menuCats=list;
    save(); closeModal(); render(); toast("Категории обновлены");
  }
  else if(k==="mediacats"){
    const list=val("mc-list").split(",").map(x=>x.trim()).filter(Boolean);
    if(list.length){ DB.mediaCats=list; DB.media.forEach(m=>{ if(list.indexOf(m.cat)<0) m.cat=list[list.length-1]; }); }
    save(); closeModal(); render(); toast("Категории обновлены");
  }
  else if(k==="media"){
    const title=val("mk-title"); if(!title){ toast("Нужно название"); return; }
    const catEl=document.getElementById("mk-cat");
    const m={id:uid(M.mkKind==="book"?"b":"f"),kind:M.mkKind,title:title,author:val("mk-author"),
      cat:catEl?catEl.value:DB.mediaCats[0],pinned:chk("mk-pin"),emoji:M.mkEmoji,comment:val("mk-comment"),
      link:"",startedAt:chk("mk-pin")?iso(TODAY):null,rating:0};
    DB.media.push(m); if(m.pinned) UI.justPinned=m.id;
    save(); closeModal(); UI.mediaTab=m.kind; render(); toast("Добавлено на полку");
  }
  else if(k==="remtotask"){
    const r=DB.reminders.find(x=>x.id===id), pid=document.getElementById("rt-proj").value;
    if(!pid){ toast("Нужно выбрать проект — направление определяется через него"); return; }
    DB.tasks.push({id:uid("t"),project:pid,title:r.text,status:"open",pinned:false,
      deadline:val("rt-deadline")||null,time:null,est:val("rt-est")||null,comment:r.comment,
      checklist:[],remindAt:null,doneAt:null});
    DB.reminders=DB.reminders.filter(x=>x.id!==id);
    save(); closeModal(); render(); toast("Стало задачей проекта «"+proj(pid).title+"»");
  }
  else if(k==="aibatch"){
    let ok=0, fail=0;
    UI.aiBatch.filter(b=>b.on).forEach(b=>{ if(applyProposal(b)) ok++; else fail++; });
    save();
    if(fail&&!ok){ renderAiBatch(); return; }
    closeModal(); render();
    toast("Применено: "+ok+(fail?". Не хватило данных: "+fail:""));
  }
  else if(k==="tgdate"){
    const p=Object.assign({},M.tgPayload,{date:val("pd-date"),time:val("pd-time")||null});
    createReminderFromPhrase(p);
    UI.tgLog.push({who:"bot",text:"Напомню "+longDate(p.date)+(p.time?" в "+p.time:" в утренней сводке")+": «"+esc(p.text||"")+"»."});
    closeModal(); render();
  }
}

document.addEventListener("change",function(e){
  const t=e.target; let n;
  if((n=t.closest("[data-taskf]"))){
    const k=n.dataset.taskf;
    UI.taskF[k] = (n.type==="checkbox") ? n.checked : n.value;
    render(); return;
  }
  if((n=t.closest("[data-idraft]"))){
    const p=n.dataset.idraft.split(":"), it=DB.inbox.find(x=>x.id===p[0]);
    it.draft=it.draft||{type:"keep",text:it.text,project:"",deadline:"",remindAt:"",delivery:"digest",comment:"",est:""};
    it.draft[p[1]]=n.value;
    if(p[1]==="type") render();
    return;
  }
  if((n=t.closest("[data-b]"))){
    const p=n.dataset.b.split(":"); UI.aiBatch[+p[0]][p[1]]=n.value;
    if(p[1]==="type") renderAiBatch();
    return;
  }
  if(t.matches('[data-set="digestTime"]')){ DB.settings.digestTime=t.value; save(); render(); return; }
});
document.addEventListener("input",function(e){
  const n=e.target.closest("[data-idraft]");
  if(n && n.tagName==="INPUT" && n.type==="text"){
    const p=n.dataset.idraft.split(":"), it=DB.inbox.find(x=>x.id===p[0]);
    it.draft=it.draft||{type:"keep",text:it.text,project:"",deadline:"",remindAt:"",delivery:"digest",comment:"",est:""};
    it.draft[p[1]]=n.value;
  }
  const b=e.target.closest("[data-b]");
  if(b && b.tagName==="INPUT" && b.type==="text"){ const p=b.dataset.b.split(":"); UI.aiBatch[+p[0]][p[1]]=b.value; }
});
document.addEventListener("click",function(e){
  const c=e.target.closest(".heat-cell[data-date]");
  if(c) modalDay(c.dataset.date,c.dataset.dir||null);
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ closeModal(); return; }
  if(e.target.matches("input,textarea,select")){
    if(e.key==="Enter"&&e.target.id==="tg-in"){ e.preventDefault(); tgSend(e.target.value); }
    return;
  }
  if(e.key==="n"||e.key==="т"){ e.preventDefault(); modalThought(); }
  if(e.key==="r"||e.key==="к"){ e.preventDefault(); modalRemind(null); }
  if(e.key==="t"||e.key==="е"){ e.preventDefault(); modalTouch(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){
  if(!document.documentElement.getAttribute("data-theme")) render();
});

/* ================= СТАРТ ================= */
load();
if(!DB||!DB.dirs||!DB.dirs.length) DB=seedData();
render();
})();
</script>

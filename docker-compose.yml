# Локальный демо-стенд «Траектории». Не предназначен для публичного развёртывания:
# авторизации нет, база поднимается с паролем по умолчанию.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d planner']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://planner:planner@postgres:5432/planner
      PORT: '3000'
      # ВНИМАНИЕ: это локальный демо-стенд, а не боевой запуск.
      # Настоящей авторизации в проекте пока нет, поэтому сборка поднимается
      # в dev-режиме: любой запрос выполняется от seed-пользователя.
      # Для боевого запуска нужно подключить auth-провайдер, поставить
      # NODE_ENV=production и DEV_AUTH=false — иначе API ответит 401 на всё.
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:8080
      DEV_AUTH: 'true'
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

# Локальный демо-стенд «Траектории». Не предназначен для публичного развёртывания:
# авторизации нет, база поднимается с паролем по умолчанию.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d planner']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://planner:planner@postgres:5432/planner
      PORT: '3000'

      # Стенд целиком отдаётся на :8080 через Caddy, поэтому и возврат из Google
      # приходит сюда же. Значения из .env для :3000/:5173 — это для `pnpm dev`,
      # здесь они намеренно перекрыты.
      WEB_ORIGIN: http://localhost:8080
      APP_BASE_URL: http://localhost:8080
      GOOGLE_AUTH_REDIRECT_URI: http://localhost:8080/api/auth/google/callback
      GOOGLE_CALENDAR_REDIRECT_URI: http://localhost:8080/api/calendar/google/callback

      # NODE_ENV намеренно development: в production кука сессии получает флаг
      # Secure и по http://localhost браузер её просто выбросит. Настоящий вход
      # через Google включается не этим, а DEV_AUTH=false.
      NODE_ENV: development
      DEV_AUTH: ${DEV_AUTH:-true}
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}

      # Секреты берутся из .env рядом с docker-compose.yml и в образ не попадают.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}

      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}

      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

      # Миграции применяются при каждом старте; демо-данные — только по просьбе.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

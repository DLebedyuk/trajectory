packages:
  - 'apps/*'
  - 'packages/*'

# Скрипты установки: pnpm 10 по умолчанию не выполняет ни одного и предупреждает
# про каждый пропущенный. Решение по каждому пакету принято здесь, чтобы
# `pnpm install` проходил молча и одинаково у всех.
#
# esbuild — единственный, кому postinstall действительно нужен: он ставит на
# место платформенный бинарник, без которого не работают vite, vitest и tsx.
onlyBuiltDependencies:
  - esbuild

# Этим скрипты не нужны, и запускать их незачем:
#   @nestjs/core — postinstall печатает баннер с просьбой о донате;
#   @scarf/scarf — отправляет телеметрию установки.
ignoredBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
